stages:
  - ci
  - cd

.ci_temp:
  stage: ci
  image: kroniak/ssh-client
  tags:
    - new-rgs
  variables:
    CI_SSH_USER: riversense
    CI_SSH_PORT: 3022
    CI_SSH_HOST: $HOST_tc_riversense
    CI_SSH_KEY: $KEY_tc_riversense
    COCOS_CREATOR_VERSION: '3.7.2'
    COCOS_CREATOR: '/Applications/Cocos/Creator/${COCOS_CREATOR_VERSION}/CocosCreator.app/Contents/MacOS/CocosCreator'
    COCOS_BUILD_PLATFORM: 'web-mobile'
  before_script:
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - echo "$CI_SSH_KEY"
    - echo "$CI_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  script:
    - echo '============== CI 開始 =============='
    - |
      if [ -z ${CI_COMMIT_TAG+x} ];
      then
        VERSION=$CI_COMMIT_SHA
        CI_COMMIT_TAG=$CI_COMMIT_SHA
      else
        VERSION=$CI_COMMIT_TAG
      fi
      ssh -o ServerAliveInterval=600 -p $CI_SSH_PORT -l $CI_SSH_USER $CI_SSH_HOST <<-EOF
        cd /Users/riversense/deploy/${CI_PROJECT_NAME}/${CI_PROJECT_NAME}
        source ~/.nvm/nvm.sh
        git reset --hard
        git fetch -a
        git remote prune origin
        git checkout .
        echo "CI_COMMIT_TAG: $CI_COMMIT_TAG"
        git checkout $CI_COMMIT_TAG
        echo '============== 關聯 ${CI_PROJECT_NAME} 資源 =============='
        cd ./tools
        npm i
        npm run main
        echo '============== 封裝 ${CI_PROJECT_NAME} =============='
        cd ..
        ${COCOS_CREATOR} --project ./proj --build configPath="./buildConfig_${COCOS_BUILD_PLATFORM}.json"
        cd proj/build/${COCOS_BUILD_PLATFORM}
        zip -r ${CI_COMMIT_SHA} ./*
      EOF
    - scp -P $CI_SSH_PORT -r $CI_SSH_USER@$CI_SSH_HOST:/Users/${CI_SSH_USER}/deploy/${CI_PROJECT_NAME}/${CI_PROJECT_NAME}/proj/build/${COCOS_BUILD_PLATFORM}/${CI_COMMIT_SHA}.zip ./${CI_COMMIT_SHA}.zip
    - unzip ${CI_COMMIT_SHA}.zip -d ./${CI_COMMIT_SHA}
  rules:
    - if: "$CI_COMMIT_SHA != null"
      when: never
  artifacts:
    paths:
      - ${CI_COMMIT_SHA}

.cd_temp:
  stage: cd
  image: kroniak/ssh-client
  variables:
    CD_SSH_USER: ubuntu
    CD_SSH_PORT: 22
    CD_SSH_HOST: target-server
    CD_SSH_KEY: private-key-for-target-server
  before_script:
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - echo "$CD_SSH_KEY"
    - echo "$CD_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  script:
    - echo '============== CD 開始 =============='
    - ssh -p $CD_SSH_PORT -l $CD_SSH_USER $CD_SSH_HOST "sudo rm -rf ~/games/horse-racing-movie"
    - scp -r -P $CD_SSH_PORT ${CI_COMMIT_SHA} $CD_SSH_USER@$CD_SSH_HOST:~/games/horse-racing-movie
    - ssh -p $CD_SSH_PORT -l $CD_SSH_USER $CD_SSH_HOST 'sudo chown -R $CD_SSH_USER:$CD_SSH_USER ~/games/horse-racing-movie/*'
    - echo '============== CD 完成 =============='
  rules:
    - if: "$CI_COMMIT_SHA != null"
      when: never

#####  develop Slot-game-Test2  #####
DEV_打包:
  extends: .ci_temp
  rules:
    - if: "$CI_COMMIT_BRANCH =~ /(feature|develop)/"
      when: manual

DEV_部署:
  extends: .cd_temp
  variables:
    CD_SSH_HOST: $HOST_slot_game_Test2
    CD_SSH_KEY: $KEY_slot_game_Test2
  rules:
    - if: "$CI_COMMIT_BRANCH =~ /(feature|develop)/"
  dependencies:
    - DEV_打包
  needs: ["DEV_打包"]

##### 以下為 GCP QAT #####
QAT_打包:
  extends: .ci_temp
  tags:
    - gcp
  rules:
    - if: "$CI_COMMIT_BRANCH =~ /(release|hotfix)/"
      when: manual

QAT_部署:
  extends: .cd_temp
  variables:
    CD_SSH_HOST: $HOST_qat_gcp_atg_socket1
    CD_SSH_KEY: $KEY_prod_gcp_atg_ec2
  rules:
    - if: "$CI_COMMIT_BRANCH =~ /(release|hotfix)/"
  tags:
    - gcp
  dependencies:
    - QAT_打包
  needs: ["QAT_打包"]

##### 以下為 AWS PROD #####
PROD_打包:
  extends: .ci_temp
  tags:
    - new-rgs
  rules:
    - if: $CI_COMMIT_TAG =~ /^[0-9]{6}(?:_([0-9]*))?$/
      when: manual

PROD_部署:
  extends: .cd_temp
  variables:
    CD_SSH_HOST: $HOST_prod_aws_atg_socket1
    CD_SSH_KEY: $KEY_prod_aws_rgs_socket
  tags:
    - new-rgs
  rules:
    - if: $CI_COMMIT_TAG =~ /^[0-9]{6}(?:_([0-9]*))?$/
  dependencies:
    - PROD_打包
  needs: ["PROD_打包"]

##### 以下為 AWS PROD ZONE1 #####
PROD_ZONE1_打包:
  extends: .ci_temp
  tags:
    - zone1
  rules:
    - if: $CI_COMMIT_TAG =~ /^[0-9]{6}(?:_([0-9]*))?$/
      when: manual

PROD_ZONE1_部署:
  extends: .cd_temp
  variables:
    CD_SSH_HOST: $HOST_prod_aws_zone1_socket1
    CD_SSH_KEY: $KEY_prod_aws_zone1_socket
  tags:
    - zone1
  rules:
    - if: $CI_COMMIT_TAG =~ /^[0-9]{6}(?:_([0-9]*))?$/
  dependencies:
    - PROD_ZONE1_打包
  needs: ["PROD_ZONE1_打包"]
