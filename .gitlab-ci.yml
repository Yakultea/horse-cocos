  extends: .update_temp
  variables:
    UPDATE_OPERATOR: $PROD_ATG_OPERATOR
    UPDATE_KEY: $PROD_ATG_KEY
    UPDATE_URL: $PROD_ATG_URL
    UPDATE_SERVICE_CODE: $SERVICE_CODE
  rules:
    - if: '$CI_COMMIT_TAG != null'
